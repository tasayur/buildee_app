{% extends "base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block page_title %}<i class="fa-solid fa-key"></i> パスワード変更{% endblock %}
{% block content %}
<div style="max-width:480px;margin:0 auto">
  <div class="dash-card">
    <div class="card-header"><i class="fa-solid fa-lock text-orange"></i> パスワードを変更する</div>
    <div class="card-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}" style="margin-bottom:14px">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="form-group" style="margin-bottom:14px">
          <label>現在のパスワード</label>
          <input type="password" name="current_password" required style="width:100%">
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label>新しいパスワード（8文字以上）</label>
          <input type="password" name="new_password" required minlength="8" style="width:100%">
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label>新しいパスワード（確認）</label>
          <input type="password" name="confirm_password" required style="width:100%">
        </div>
        <div style="display:flex;gap:10px">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> 変更する</button>
          <a href="/" class="btn btn-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
