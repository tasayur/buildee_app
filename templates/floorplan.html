{% extends "base.html" %}
{% block title %}配置図 - BuildeeMgr{% endblock %}

{% block content %}
<div class="page-header" style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
  <h2 style="margin:0;">📐 配置図</h2>
</div>

<!-- フロア切替タブ -->
<div class="floorplan-tabs">
  <button class="tab-btn active" onclick="showFloor('1f', this)">1F</button>
  <button class="tab-btn"       onclick="showFloor('2f', this)">2F</button>
</div>

<!-- ツールバー -->
<div class="fp-toolbar">
  <div class="tool-group">
    <button class="tool-btn active" id="tool-select" onclick="setTool('select', this)" title="選択・移動">
      🖱 選択
    </button>
    <button class="tool-btn" id="tool-pin" onclick="setTool('pin', this)" title="ピンを立てる">
      📍 ピン
    </button>
    <button class="tool-btn" id="tool-memo" onclick="setTool('memo', this)" title="メモを追加">
      📝 メモ
    </button>
    <button class="tool-btn" id="tool-area" onclick="setTool('area', this)" title="エリアをマーク">
      🟥 エリア
    </button>
  </div>
  <div class="tool-group">
    <select id="marker-color" title="色選択">
      <option value="#e53935">🔴 赤</option>
      <option value="#FB8C00">🟠 オレンジ</option>
      <option value="#F9A825">🟡 黄</option>
      <option value="#43A047">🟢 緑</option>
      <option value="#1E88E5">🔵 青</option>
      <option value="#8E24AA">🟣 紫</option>
    </select>
  </div>
  <div class="tool-group">
    <button class="ctrl-btn" onclick="zoomActive(1.25)">🔍＋</button>
    <button class="ctrl-btn" onclick="zoomActive(0.8)">🔍－</button>
    <button class="ctrl-btn" onclick="resetActive()">↺ リセット</button>
  </div>
  <div class="tool-group" style="margin-left:auto;">
    <button class="ctrl-btn danger" onclick="clearAllMarkers()">🗑 全消去</button>
    <button class="ctrl-btn success" onclick="downloadWithMarkers()">📸 画像保存</button>
  </div>
</div>

<!-- 1F -->
<div id="floor-1f" class="floor-panel active">
  <div class="fp-wrap" id="wrap-1f">
    <div class="fp-canvas" id="canvas-1f">
      <img src="{{ url_for('static', filename='floorplans/floorplan_1f.png') }}"
           alt="1F 配置図" class="floorplan-img" id="img-1f"
           draggable="false">
      <div class="marker-layer" id="markers-1f"></div>
    </div>
  </div>
</div>

<!-- 2F -->
<div id="floor-2f" class="floor-panel" style="display:none;">
  <div class="fp-wrap" id="wrap-2f">
    <div class="fp-canvas" id="canvas-2f">
      <img src="{{ url_for('static', filename='floorplans/floorplan_2f.png') }}"
           alt="2F 配置図" class="floorplan-img" id="img-2f"
           draggable="false">
      <div class="marker-layer" id="markers-2f"></div>
    </div>
  </div>
</div>

<!-- メモ入力ダイアログ -->
<div id="memo-dialog" class="dialog-overlay" style="display:none;">
  <div class="dialog-box">
    <h3>📝 メモを入力</h3>
    <input type="text" id="memo-title" placeholder="タイトル（例: 注意箇所）" maxlength="30">
    <textarea id="memo-body" placeholder="メモ内容を入力してください" rows="4" maxlength="200"></textarea>
    <div class="dialog-btns">
      <button onclick="cancelMemo()">キャンセル</button>
      <button class="btn-primary" onclick="confirmMemo()">追加</button>
    </div>
  </div>
</div>

<!-- マーカー詳細ポップアップ -->
<div id="marker-popup" class="marker-popup" style="display:none;">
  <div class="popup-header">
    <span id="popup-title"></span>
    <button onclick="closePopup()">✕</button>
  </div>
  <div id="popup-body" class="popup-body"></div>
  <div class="popup-footer">
    <button class="btn-danger-sm" onclick="deleteCurrentMarker()">🗑 削除</button>
  </div>
</div>

<style>
/* ===== ツールバー ===== */
.fp-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  background: #f5f5f5;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 0.5rem 0.75rem;
  margin-bottom: 0.75rem;
}
.tool-group { display: flex; gap: 0.4rem; align-items: center; }
.tool-btn {
  padding: 0.35rem 0.8rem;
  border: 2px solid #bbb;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: bold;
  transition: all 0.15s;
}
.tool-btn:hover { border-color: #555; background: #f0f0f0; }
.tool-btn.active { border-color: #1E88E5; background: #E3F2FD; color: #1E88E5; }
.ctrl-btn {
  padding: 0.35rem 0.75rem;
  border: 1px solid #bbb;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 0.85rem;
}
.ctrl-btn:hover { background: #eee; }
.ctrl-btn.danger { border-color: #e53935; color: #e53935; }
.ctrl-btn.danger:hover { background: #FFEBEE; }
.ctrl-btn.success { border-color: #43A047; color: #43A047; }
.ctrl-btn.success:hover { background: #E8F5E9; }
#marker-color {
  padding: 0.3rem 0.5rem;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 0.85rem;
}

/* ===== フロアタブ ===== */
.floorplan-tabs { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
.tab-btn {
  padding: 0.5rem 2rem;
  font-size: 1rem;
  font-weight: bold;
  border: 2px solid #333;
  background: #fff;
  cursor: pointer;
  border-radius: 6px;
}
.tab-btn.active { background: #333; color: #fff; }

/* ===== キャンバスエリア ===== */
.fp-wrap {
  overflow: auto;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #f0f0f0;
  height: 65vh;
  position: relative;
  cursor: crosshair;
}
.fp-wrap.select-mode { cursor: default; }
.fp-canvas {
  position: relative;
  display: inline-block;
  transform-origin: top left;
  transition: transform 0.15s;
}
.floorplan-img {
  display: block;
  max-width: 100%;
  user-select: none;
  pointer-events: none;
}
.marker-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ===== マーカー共通 ===== */
.marker {
  position: absolute;
  pointer-events: all;
  cursor: pointer;
  transition: transform 0.1s;
}
.marker:hover { transform: scale(1.2); z-index: 100; }

/* ピン */
.pin-marker {
  width: 28px;
  height: 28px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg) translate(-50%, -50%);
  border: 3px solid rgba(0,0,0,0.3);
  box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
.pin-marker::after {
  content: '';
  width: 10px;
  height: 10px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  position: absolute;
  top: 4px; left: 4px;
}

/* メモ */
.memo-marker {
  background: #FFF9C4;
  border: 2px solid #F9A825;
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 0.75rem;
  font-weight: bold;
  max-width: 120px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
  transform: translate(-50%, -100%);
  margin-top: -8px;
}

/* エリア */
.area-marker {
  border: 3px dashed;
  border-radius: 4px;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: flex-start;
  padding: 4px 6px;
  font-size: 0.72rem;
  font-weight: bold;
  color: inherit;
  box-sizing: border-box;
  min-width: 60px;
  min-height: 40px;
}

/* ===== ポップアップ ===== */
.marker-popup {
  position: fixed;
  z-index: 500;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  width: 240px;
  font-size: 0.9rem;
}
.popup-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.5rem 0.75rem;
  background: #333;
  color: #fff;
  border-radius: 8px 8px 0 0;
  font-weight: bold;
}
.popup-header button {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 1rem;
}
.popup-body { padding: 0.75rem; white-space: pre-wrap; color: #333; min-height: 40px; }
.popup-footer {
  padding: 0.5rem 0.75rem;
  border-top: 1px solid #eee;
  text-align: right;
}
.btn-danger-sm {
  padding: 0.3rem 0.75rem;
  background: #e53935;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
}
.btn-danger-sm:hover { background: #c62828; }

/* ===== ダイアログ ===== */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dialog-box {
  background: #fff;
  border-radius: 10px;
  padding: 1.5rem;
  width: 340px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
}
.dialog-box h3 { margin: 0 0 1rem; }
.dialog-box input, .dialog-box textarea {
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 0.5rem;
  font-size: 0.9rem;
  margin-bottom: 0.75rem;
  box-sizing: border-box;
  font-family: inherit;
}
.dialog-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }
.dialog-btns button {
  padding: 0.4rem 1.2rem;
  border-radius: 6px;
  border: 1px solid #bbb;
  cursor: pointer;
  font-size: 0.9rem;
  background: #fff;
}
.btn-primary { background: #1E88E5 !important; color: #fff !important; border-color: #1E88E5 !important; }
.btn-primary:hover { background: #1565C0 !important; }

/* エリア描画中 */
.area-drawing {
  position: absolute;
  border: 3px dashed #e53935;
  background: rgba(229,57,53,0.1);
  pointer-events: none;
  z-index: 200;
}
</style>

<script>
// ===== 状態管理 =====
let currentFloor = '1f';
let currentTool  = 'select';
let scales       = { '1f': 1.0, '2f': 1.0 };
let markers      = { '1f': [], '2f': [] }; // 保存データ
let pendingPos   = null;  // メモ追加待ち座標
let currentMarkerId = null;
let markerSeq    = 0;

// エリア描画用
let isDrawing = false;
let drawStart = null;
let drawEl    = null;

// ===== ツール切替 =====
function setTool(tool, btn) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const wrap = document.getElementById('wrap-' + currentFloor);
  wrap.style.cursor = tool === 'select' ? 'default' : 'crosshair';
}

// ===== フロア切替 =====
function showFloor(floor, btn) {
  currentFloor = floor;
  document.querySelectorAll('.floor-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('floor-' + floor).style.display = 'block';
  btn.classList.add('active');
  closePopup();
}

// ===== ズーム =====
function zoomActive(f) { applyZoom(currentFloor, f); }
function resetActive()  { scales[currentFloor] = 1.0; applyScale(currentFloor); }
function applyZoom(fl, f) {
  scales[fl] = Math.min(Math.max((scales[fl] || 1) * f, 0.2), 6.0);
  applyScale(fl);
}
function applyScale(fl) {
  document.getElementById('canvas-' + fl).style.transform = `scale(${scales[fl]})`;
}

// ===== クリックでマーカー追加 =====
document.querySelectorAll('.fp-wrap').forEach(wrap => {
  wrap.addEventListener('click', onCanvasClick);
  wrap.addEventListener('mousedown', onAreaStart);
  wrap.addEventListener('mousemove', onAreaMove);
  wrap.addEventListener('mouseup', onAreaEnd);
});

function getRelPos(wrap, e) {
  const canvas = wrap.querySelector('.fp-canvas');
  const rect   = canvas.getBoundingClientRect();
  const sc     = scales[currentFloor];
  return {
    x: (e.clientX - rect.left) / sc,
    y: (e.clientY - rect.top)  / sc,
  };
}

function onCanvasClick(e) {
  if (currentTool === 'select') return;
  if (currentTool === 'area')   return;
  if (e.target.classList.contains('marker') ||
      e.target.closest('.marker')) return;

  const pos = getRelPos(this, e);

  if (currentTool === 'pin') {
    addPin(currentFloor, pos.x, pos.y);
    saveMarkers();
  } else if (currentTool === 'memo') {
    pendingPos = pos;
    openMemoDialog();
  }
}

// ===== エリア描画 =====
function onAreaStart(e) {
  if (currentTool !== 'area') return;
  if (e.target.classList.contains('marker') || e.target.closest('.marker')) return;
  isDrawing = true;
  const wrap   = document.getElementById('wrap-' + currentFloor);
  const canvas = document.getElementById('canvas-' + currentFloor);
  const rect   = canvas.getBoundingClientRect();
  const sc     = scales[currentFloor];
  drawStart = {
    x: (e.clientX - rect.left) / sc,
    y: (e.clientY - rect.top)  / sc,
  };
  drawEl = document.createElement('div');
  drawEl.className = 'area-drawing';
  canvas.appendChild(drawEl);
}

function onAreaMove(e) {
  if (!isDrawing || !drawEl) return;
  const canvas = document.getElementById('canvas-' + currentFloor);
  const rect   = canvas.getBoundingClientRect();
  const sc     = scales[currentFloor];
  const cx = (e.clientX - rect.left) / sc;
  const cy = (e.clientY - rect.top)  / sc;
  const x = Math.min(cx, drawStart.x);
  const y = Math.min(cy, drawStart.y);
  const w = Math.abs(cx - drawStart.x);
  const h = Math.abs(cy - drawStart.y);
  drawEl.style.left   = x + 'px';
  drawEl.style.top    = y + 'px';
  drawEl.style.width  = w + 'px';
  drawEl.style.height = h + 'px';
}

function onAreaEnd(e) {
  if (!isDrawing || !drawEl) return;
  isDrawing = false;
  const canvas = document.getElementById('canvas-' + currentFloor);
  const rect   = canvas.getBoundingClientRect();
  const sc     = scales[currentFloor];
  const cx = (e.clientX - rect.left) / sc;
  const cy = (e.clientY - rect.top)  / sc;
  const x = Math.min(cx, drawStart.x);
  const y = Math.min(cy, drawStart.y);
  const w = Math.abs(cx - drawStart.x);
  const h = Math.abs(cy - drawStart.y);
  canvas.removeChild(drawEl);
  drawEl = null;
  if (w < 10 || h < 10) return;
  pendingPos = { x, y, w, h };
  openMemoDialog();
}

// ===== ピン追加 =====
function addPin(floor, x, y, data={}) {
  const id    = data.id || ('m' + (++markerSeq));
  const color = data.color || document.getElementById('marker-color').value;
  const label = data.label || '';

  const el = document.createElement('div');
  el.className = 'marker pin-marker';
  el.id = id;
  el.style.left            = x + 'px';
  el.style.top             = y + 'px';
  el.style.backgroundColor = color;
  el.title = label || 'ピン';
  el.addEventListener('click', e => { e.stopPropagation(); showPopup(id, floor, e); });

  document.getElementById('markers-' + floor).appendChild(el);

  if (!data.id) {
    markers[floor].push({ id, type:'pin', x, y, color, label });
  }
}

// ===== メモ追加 =====
function addMemo(floor, x, y, data={}) {
  const id    = data.id || ('m' + (++markerSeq));
  const color = data.color || document.getElementById('marker-color').value;
  const title = data.title || 'メモ';
  const body  = data.body  || '';

  const el = document.createElement('div');
  el.className = 'marker memo-marker';
  el.id = id;
  el.style.left        = x + 'px';
  el.style.top         = y + 'px';
  el.style.borderColor = color;
  el.style.color       = color;
  el.textContent = title;
  el.addEventListener('click', e => { e.stopPropagation(); showPopup(id, floor, e); });

  document.getElementById('markers-' + floor).appendChild(el);

  if (!data.id) {
    markers[floor].push({ id, type:'memo', x, y, color, title, body });
  }
}

// ===== エリア追加 =====
function addArea(floor, x, y, w, h, data={}) {
  const id    = data.id || ('m' + (++markerSeq));
  const color = data.color || document.getElementById('marker-color').value;
  const title = data.title || 'エリア';
  const body  = data.body  || '';

  const el = document.createElement('div');
  el.className = 'marker area-marker';
  el.id = id;
  el.style.left        = x + 'px';
  el.style.top         = y + 'px';
  el.style.width       = w + 'px';
  el.style.height      = h + 'px';
  el.style.borderColor = color;
  el.style.color       = color;
  el.textContent = title;
  el.addEventListener('click', e => { e.stopPropagation(); showPopup(id, floor, e); });

  document.getElementById('markers-' + floor).appendChild(el);

  if (!data.id) {
    markers[floor].push({ id, type:'area', x, y, w, h, color, title, body });
  }
}

// ===== メモダイアログ =====
function openMemoDialog() {
  document.getElementById('memo-title').value = '';
  document.getElementById('memo-body').value  = '';
  document.getElementById('memo-dialog').style.display = 'flex';
  document.getElementById('memo-title').focus();
}
function cancelMemo() {
  pendingPos = null;
  document.getElementById('memo-dialog').style.display = 'none';
}
function confirmMemo() {
  const title = document.getElementById('memo-title').value.trim() || 'メモ';
  const body  = document.getElementById('memo-body').value.trim();
  const color = document.getElementById('marker-color').value;
  document.getElementById('memo-dialog').style.display = 'none';

  if (!pendingPos) return;
  const { x, y, w, h } = pendingPos;

  if (currentTool === 'area' && w !== undefined) {
    addArea(currentFloor, x, y, w, h,
      { color, title, body });
    markers[currentFloor].push({
      id: document.getElementById('markers-' + currentFloor).lastChild.id,
      type:'area', x, y, w, h, color, title, body
    });
    // 直前に pushした分はaddArea内で既にpushされているので要調整
  } else {
    addMemo(currentFloor, x, y, { color, title, body });
    const last = markers[currentFloor][markers[currentFloor].length-1];
    last.title = title;
    last.body  = body;
  }
  pendingPos = null;
  saveMarkers();
}

// ===== ポップアップ =====
function showPopup(id, floor, e) {
  currentMarkerId = id;
  const m = markers[floor].find(m => m.id === id);
  if (!m) return;

  const pop = document.getElementById('marker-popup');
  const typeLabel = { pin:'📍 ピン', memo:'📝 メモ', area:'🟥 エリア' }[m.type] || 'マーカー';
  document.getElementById('popup-title').textContent = m.title || typeLabel;
  document.getElementById('popup-body').textContent  = m.body  || m.label || '';

  pop.style.display = 'block';
  // 位置調整
  const vw = window.innerWidth, vh = window.innerHeight;
  let px = e.clientX + 10, py = e.clientY + 10;
  if (px + 250 > vw) px = e.clientX - 260;
  if (py + 160 > vh) py = e.clientY - 160;
  pop.style.left = px + 'px';
  pop.style.top  = py + 'px';
}
function closePopup() {
  document.getElementById('marker-popup').style.display = 'none';
  currentMarkerId = null;
}
function deleteCurrentMarker() {
  if (!currentMarkerId) return;
  const el = document.getElementById(currentMarkerId);
  if (el) el.remove();
  markers[currentFloor] = markers[currentFloor].filter(m => m.id !== currentMarkerId);
  saveMarkers();
  closePopup();
}

// ===== 全消去 =====
function clearAllMarkers() {
  if (!confirm(`${currentFloor.toUpperCase()} のマーカーをすべて削除しますか？`)) return;
  document.getElementById('markers-' + currentFloor).innerHTML = '';
  markers[currentFloor] = [];
  saveMarkers();
}

// ===== localStorage 保存/復元 =====
function saveMarkers() {
  localStorage.setItem('buildee_markers', JSON.stringify(markers));
}
function loadMarkers() {
  const saved = localStorage.getItem('buildee_markers');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    ['1f','2f'].forEach(fl => {
      (data[fl] || []).forEach(m => {
        if (m.id && parseInt(m.id.replace('m','')) >= markerSeq)
          markerSeq = parseInt(m.id.replace('m',''));
        if (m.type === 'pin')  addPin(fl, m.x, m.y, m);
        if (m.type === 'memo') addMemo(fl, m.x, m.y, m);
        if (m.type === 'area') addArea(fl, m.x, m.y, m.w, m.h, m);
      });
      if (data[fl]) markers[fl] = data[fl];
    });
  } catch(e) { console.warn('marker load error', e); }
}

// ===== 画像保存（マーカー込み）=====
async function downloadWithMarkers() {
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  document.head.appendChild(script);
  await new Promise(r => script.onload = r);

  const canvas = document.getElementById('canvas-' + currentFloor);
  const sc = scales[currentFloor];
  // 一時的にスケールをリセット
  canvas.style.transform = 'scale(1)';
  const cnv = await html2canvas(canvas, { scale: 1, useCORS: true });
  canvas.style.transform = `scale(${sc})`;

  const a = document.createElement('a');
  a.download = `配置図_${currentFloor.toUpperCase()}_マーカー付き.png`;
  a.href = cnv.toDataURL('image/png');
  a.click();
}

// ===== 初期化 =====
document.addEventListener('DOMContentLoaded', () => {
  loadMarkers();
  // Escキーでダイアログ・ポップアップを閉じる
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { cancelMemo(); closePopup(); }
  });
  // 地図以外クリックでポップアップを閉じる
  document.addEventListener('click', e => {
    const pop = document.getElementById('marker-popup');
    if (pop.style.display !== 'none' &&
        !pop.contains(e.target) &&
        !e.target.classList.contains('marker')) {
      closePopup();
    }
  });
});
</script>
{% endblock %}
