{% extends "base.html" %}
{% block title %}配置図 - BuildeeMgr{% endblock %}

{% block content %}
<div class="fp-header">
  <h2>📐 配置図</h2>
  <span id="fp-sync" class="sync-badge sync-ok">✅ 同期済み</span>
</div>

<!-- フロア切替 -->
<div class="fp-floor-tabs">
  <button class="fp-ftab active" id="fptab-1f"      onclick="switchFloor('1f',this)">1F</button>
  <button class="fp-ftab"        id="fptab-2f"      onclick="switchFloor('2f',this)">2F</button>
  <button class="fp-ftab"        id="fptab-3f"      onclick="switchFloor('3f',this)">3F</button>
  <button class="fp-ftab"        id="fptab-4f"      onclick="switchFloor('4f',this)">4F</button>
  <button class="fp-ftab"        id="fptab-5f"      onclick="switchFloor('5f',this)">5F</button>
  <button class="fp-ftab"        id="fptab-roof"    onclick="switchFloor('roof',this)">屋上</button>
  <button class="fp-ftab"        id="fptab-outdoor" onclick="switchFloor('outdoor',this)">屋外</button>
</div>

<!-- ツールバー -->
<div class="fp-toolbar">
  <div class="tb-group">
    <button class="tb-tool active" id="fpt-select"  onclick="setTool('select',this)"  title="選択・移動">🖱 選択</button>
    <button class="tb-tool"        id="fpt-pin"     onclick="setTool('pin',this)"     title="ピン">📍 ピン</button>
    <button class="tb-tool"        id="fpt-range"   onclick="setTool('range',this)"   title="作業範囲">🟦 作業範囲</button>
    <button class="tb-tool"        id="fpt-area"    onclick="setTool('area',this)"    title="エリア">🟥 エリア</button>
    <button class="tb-tool"        id="fpt-material" onclick="setTool('material',this)" title="資材">📦 資材</button>
    <button class="tb-tool"        id="fpt-aerial"  onclick="setTool('aerial',this)"  title="高所作業">🏗️ 高所</button>
    <button class="tb-tool"        id="fpt-fire"    onclick="setTool('fire',this)"    title="火気作業">🔥 火気</button>
    <button class="tb-tool"        id="fpt-comment" onclick="setTool('comment',this)" title="コメント">💬 メモ</button>
  </div>
  <div class="tb-group">
    <button class="tb-ctrl" onclick="engine.zoom(1.3)">🔍＋</button>
    <button class="tb-ctrl" onclick="engine.zoom(0.77)">🔍－</button>
    <button class="tb-ctrl" onclick="engine.zoomReset()">↺ リセット</button>
  </div>
  <div class="tb-group">
    <label class="tb-toggle">
      <input type="checkbox" id="togSchedules" checked onchange="toggleSchedules()">
      <span>📋 作業予定</span>
    </label>
  </div>
  <div class="tb-group" style="margin-left:auto;">
    <button class="tb-ctrl" onclick="reloadAll()">🔄 更新</button>
    <button class="tb-ctrl danger" onclick="engine.clearAll()">🗑 全消去</button>
    <button class="tb-ctrl success" onclick="downloadMap()">📸 保存</button>
  </div>
</div>

<!-- 1F -->
<div id="fp-floor-1f" class="fp-panel active">
  <div class="fp-wrap" id="fpWrap1f">
    <div id="fpCanvas1f" style="position:relative;display:inline-block;transform-origin:top left;transition:transform .15s;">
      <img id="fpImg1f" src="{{ url_for('static', filename='floorplans/floorplan_1f.png') }}"
           alt="1F" draggable="false" style="display:block;max-width:100%;">
      <div id="fpSchedulePins1f" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
      <div id="fpMarkerLayer1f" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
    </div>
  </div>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/marker_engine.js') }}"></script>
<script>
let currentFloor = '1f';
let engine = null;
let _schedules1f = [], _schedules2f = [];

function setSyncBadge(state, msg) {
  const el = document.getElementById('fp-sync');
  el.className = 'sync-badge sync-' + state;
  el.textContent = msg;
}

// ================================================================
//  初期化
// ================================================================
function floorId(f){
  // 1f -> 1f, roof -> Roof, outdoor -> Outdoor
  if(f==='roof') return 'Roof';
  if(f==='outdoor') return 'Outdoor';
  return f;
}
function initEngine(floor) {
  const fid = floorId(floor);
  engine = new MarkerEngine({
    canvasId: `fpCanvas${fid}`,
    imgId:    `fpImg${fid}`,
    layerId:  `fpMarkerLayer${fid}`,
    floor:    floor,
    readOnly: false,
    onSave:   () => setSyncBadge('ok', '✅ 保存しました'),
  });
}

// ================================================================
//  ツール
// ================================================================
function setTool(type, btn) {
  document.querySelectorAll('.tb-tool').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (type === 'select') {
    engine.setTool('select');
  } else {
    engine.setTool('draw');
    engine.setType(type);
  }
  document.querySelector('.fp-wrap:not([style*="display:none"])').style.cursor =
    type === 'select' ? 'default' : 'crosshair';
}

// ================================================================
//  フロア切替
// ================================================================
const ALL_FLOORS = ['1f','2f','3f','4f','5f','roof','outdoor'];
function floorKey(f){ return f.charAt(0).toUpperCase()+f.slice(1); }

async function switchFloor(floor, btn) {
  currentFloor = floor;
  document.querySelectorAll('.fp-ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ALL_FLOORS.forEach(f => {
    const el = document.getElementById('fp-floor-'+f);
    if(el) el.style.display = f === floor ? '' : 'none';
  });
  initEngine(floor);
  await engine.load(floor);
  renderSchedulePins(floor);
}

function toggleSchedules() {
  renderSchedulePins(currentFloor);
}

// ================================================================
//  作業予定ピン
// ================================================================
async function loadSchedules(floor) {
  try {
    const res = await fetch(`/api/schedules/floor/${floor}`);
    const list = await res.json();
    if (floor === '1f') _schedules1f = list;
    else                _schedules2f = list;
    renderSchedulePins(floor);
    renderLegend(floor);
  } catch(e) {}
}

function renderSchedulePins(floor) {
  const fid2 = floorId(floor);
  const layerId = `fpSchedulePins${fid2}`;
  const layer = document.getElementById(layerId);
  if (!layer) return;
  layer.innerHTML = '';
  if (!document.getElementById('togSchedules').checked) return;

  const img = document.getElementById(`fpImg${fid2}`);
  if (!img || !img.naturalWidth) return;
  const sc = engine.scale;
  const scX = (img.clientWidth * sc) / img.naturalWidth;
  const scY = (img.clientHeight * sc) / img.naturalHeight;
  const list = floor === '1f' ? _schedules1f : _schedules2f;

  list.forEach(s => {
    if (!s.map_x || !s.map_y) return;
    const color = s.color || '#1E88E5';
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:absolute;left:${s.map_x*scX}px;top:${s.map_y*scY}px;
      pointer-events:all;cursor:pointer;z-index:40;`;
    const dot = document.createElement('div');
    dot.style.cssText = `width:28px;height:28px;border-radius:50% 50% 50% 0;
      transform:rotate(-45deg) translate(-50%,-50%);background:${color};
      border:3px solid rgba(255,255,255,.85);box-shadow:2px 2px 5px rgba(0,0,0,.4);`;
    const lbl = document.createElement('div');
    lbl.style.cssText = `position:absolute;top:-28px;left:8px;background:rgba(0,0,0,.75);
      color:#fff;font-size:.68rem;padding:2px 6px;border-radius:4px;white-space:nowrap;
      opacity:0;transition:opacity .15s;pointer-events:none;`;
    lbl.textContent = `${s.company}：${s.work_content}`;
    wrap.appendChild(dot); wrap.appendChild(lbl);
    wrap.addEventListener('mouseenter', () => lbl.style.opacity='1');
    wrap.addEventListener('mouseleave', () => lbl.style.opacity='0');
    wrap.addEventListener('click', () => showToast(`${s.company}：${s.work_content}`, 'info'));
    layer.appendChild(wrap);
  });
}

function renderLegend(floor) {
  const list = floor === '1f' ? _schedules1f : _schedules2f;
  const byCompany = {};
  list.forEach(s => { if (!byCompany[s.company]) byCompany[s.company] = s.color||'#1E88E5'; });
  const el = document.getElementById('fpLegend');
  el.innerHTML = Object.entries(byCompany).map(([co, color]) =>
    `<div class="fp-leg-item"><div class="fp-leg-dot" style="background:${color}"></div><span>${co}</span></div>`
  ).join('');
}

async function reloadAll() {
  setSyncBadge('busy', '⏳ 更新中...');
  await Promise.all([engine.load(currentFloor), loadSchedules(currentFloor)]);
  setSyncBadge('ok', '✅ 同期済み');
}

async function downloadMap() {
  if (!window.html2canvas) {
    await new Promise(r => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload = r; document.head.appendChild(s);
    });
  }
  const canvasEl = document.getElementById(`fpCanvas${currentFloor}`);
  const sc = engine.scale;
  canvasEl.style.transform = 'scale(1)';
  const cnv = await html2canvas(canvasEl, { scale: 1, useCORS: true });
  canvasEl.style.transform = `scale(${sc})`;
  const a = document.createElement('a');
  a.download = `配置図_${currentFloor.toUpperCase()}.png`;
  a.href = cnv.toDataURL('image/png'); a.click();
}

// ================================================================
//  初期化
// ================================================================
document.addEventListener('DOMContentLoaded', async () => {
  initEngine('1f');
  document.getElementById('fpImg1f').addEventListener('load', () => {
    engine.redraw();
    renderSchedulePins('1f');
  });
  await Promise.all([engine.load('1f'), loadSchedules('1f')]);

  // Escキー
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') setTool('select', document.getElementById('fpt-select'));
  });
});
</script>
{% endblock %}
