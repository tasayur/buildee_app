# ==============================================================
#  nginx/nginx_windows.conf  --  BuildeeMgr Windows用 Nginx 設定
#
#  【セットアップ手順】
#  1. https://nginx.org/en/download.html から nginx/Windows をダウンロード
#  2. 展開先: C:\nginx\
#  3. このファイルを C:\nginx\conf\nginx.conf にコピー (上書き)
#  4. SSL証明書を C:\nginx\ssl\ にコピー:
#       buildee.crt  (buildee_app\certs\buildee.crt)
#       buildee.key  (buildee_app\certs\buildee.key)
#  5. start.bat でFlask起動 → C:\nginx\nginx.exe で Nginx 起動
#  6. ブラウザで https://localhost を開く
# ==============================================================

worker_processes  1;
error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json;
    client_max_body_size 16m;

    # Rate limiting
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=60r/m;

    # Upstream: Flask (app.py を python app.py で起動)
    upstream flask_app {
        server 127.0.0.1:5000;
    }

    # ----------------------------------------------------------
    # HTTP → HTTPS リダイレクト
    # ----------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;

        location /.well-known/acme-challenge/ {
            root C:/nginx/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------
    # HTTPS メインサーバー
    # ----------------------------------------------------------
    server {
        listen       443 ssl;
        server_name  localhost;

        # SSL証明書 (buildee_app\certs\ からコピー)
        ssl_certificate     C:/nginx/ssl/buildee.crt;
        ssl_certificate_key C:/nginx/ssl/buildee.key;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;

        # セキュリティヘッダー
        add_header Strict-Transport-Security  "max-age=31536000" always;
        add_header X-Frame-Options            "DENY"             always;
        add_header X-Content-Type-Options     "nosniff"          always;
        add_header X-XSS-Protection           "1; mode=block"    always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

        # 静的ファイル直配信
        location /static/ {
            # buildee_appフォルダのパスに合わせて変更
            alias   C:/Users/tasayur/Desktop/buildee_app/static/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # PWA特殊ヘッダー
        location = /static/js/sw.js {
            alias   C:/Users/tasayur/Desktop/buildee_app/static/js/sw.js;
            add_header Cache-Control          "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        # ログイン: レート制限
        location = /login {
            limit_req  zone=login  burst=3  nodelay;
            proxy_pass       http://flask_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: レート制限
        location /api/ {
            limit_req  zone=api  burst=20  nodelay;
            proxy_pass       http://flask_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # メインアプリ
        location / {
            proxy_pass       http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        error_page  404 500 502 503 504  /offline;
        access_log  logs/buildee_access.log  main;
        error_log   logs/buildee_error.log   warn;
    }
}
