# ==============================================================
#  nginx/nginx.conf  --  BuildeeMgr メイン Nginx 設定
#  対象: Linux 本番 / Docker環境
#  Flask (Gunicorn): http://127.0.0.1:5000 でリッスン
# ==============================================================

user  nginx;
worker_processes  auto;          # CPU コア数に自動最適化
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;   # Linux高性能I/O
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ---- Performance ----
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css text/javascript
                       application/javascript application/json
                       application/xml image/svg+xml;
    gzip_min_length    1024;
    gzip_comp_level    5;

    # ---- Security: hide server version ----
    server_tokens      off;

    # ---- Request limits ----
    client_max_body_size  16m;   # Excel出力・QR画像アップロード対応
    client_body_timeout   30s;
    client_header_timeout 30s;

    # ---- Rate limiting ----
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=5r/m;   # ログイン: 5回/分
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=60r/m;  # API: 60回/分

    # ---- Upstream: Flask / Gunicorn ----
    upstream flask_app {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    # ---- Include virtual host configs ----
    include /etc/nginx/conf.d/*.conf;
}
