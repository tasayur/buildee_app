# ==============================================================
#  nginx/conf.d/buildee.conf  --  BuildeeMgr バーチャルホスト
#
#  【使い方】
#  1. SERVER_NAME を実際のドメイン or IP に変更
#  2. SSL証明書パスを設定
#  3. nginx -t で構文確認 → nginx -s reload で反映
# ==============================================================

# ------- 変数: ここだけ変更すればOK -------
# 実際のドメイン名 or IPアドレス
# 例: server_name buildee.example.com;
#     server_name 192.168.1.100;
# ------------------------------------------

# ============================================================
#  [1] HTTP (port 80)  →  HTTPS 301 リダイレクト
# ============================================================
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;    # ← 本番では実ドメインに変更

    # Let's Encrypt ACME チャレンジ用 (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # それ以外は全て HTTPS へ
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  [2] HTTPS (port 443)  --  メインサーバー
# ============================================================
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  localhost;    # ← 本番では実ドメインに変更

    # ---- SSL 証明書 ----
    # 自己署名証明書 (開発用)
    ssl_certificate     /etc/nginx/ssl/buildee.crt;
    ssl_certificate_key /etc/nginx/ssl/buildee.key;
    # Let's Encrypt 本番用 (コメント解除して使用)
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # ---- TLS 設定 ----
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;
    ssl_stapling               on;
    ssl_stapling_verify        on;

    # ---- セキュリティヘッダー ----
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "DENY"               always;
    add_header X-Content-Type-Options     "nosniff"            always;
    add_header X-XSS-Protection           "1; mode=block"      always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none';"
        always;

    # ---- 静的ファイル (Nginx直配信 / Flaskより高速) ----
    location /static/ {
        alias      /app/static/;
        expires    7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 大きなアイコン・Excel等のキャッシュ
        location ~* \.(xlsx|zip|pdf)$ {
            expires 1d;
        }
    }

    # ---- manifest / sw.js (PWA) ----
    location = /static/manifest.json {
        alias      /app/static/manifest.json;
        add_header Cache-Control "no-cache";
        add_header Content-Type  "application/manifest+json";
    }
    location = /static/js/sw.js {
        alias      /app/static/js/sw.js;
        add_header Cache-Control           "no-cache";
        add_header Service-Worker-Allowed  "/";
    }

    # ---- ログインレート制限 ----
    location = /login {
        limit_req  zone=login  burst=3  nodelay;
        limit_req_status 429;
        proxy_pass         http://flask_app;
        include            /etc/nginx/conf.d/proxy_params.conf;
    }

    # ---- API レート制限 ----
    location /api/ {
        limit_req  zone=api  burst=20  nodelay;
        proxy_pass         http://flask_app;
        include            /etc/nginx/conf.d/proxy_params.conf;
    }

    # ---- メインアプリ (Flask プロキシ) ----
    location / {
        proxy_pass         http://flask_app;
        include            /etc/nginx/conf.d/proxy_params.conf;
    }

    # ---- エラーページ ----
    error_page  404              /offline;
    error_page  500 502 503 504  /offline;

    # ---- アクセスログ ----
    access_log /var/log/nginx/buildee_access.log main;
    error_log  /var/log/nginx/buildee_error.log  warn;
}
