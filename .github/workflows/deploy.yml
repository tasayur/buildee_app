# ================================================================
#  .github/workflows/deploy.yml
#  GitHub Actions CI/CD パイプライン
#
#  トリガー:
#    - main ブランチへの push → 自動テスト → 本番デプロイ
#    - タグ v*.*.* → リリースデプロイ
#
#  必要な GitHub Secrets:
#    PROD_HOST       本番サーバーのIPまたはホスト名
#    PROD_USER       SSH ユーザー名
#    PROD_SSH_KEY    SSH 秘密鍵（-----BEGIN ... KEY-----）
#    PROD_APP_DIR    サーバー上のアプリディレクトリ（例: /opt/buildee_app）
# ================================================================
name: BuildeeMgr CI/CD

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: buildee_app

jobs:
  # ============================================================
  #  CI: テスト
  # ============================================================
  test:
    name: テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージインストール
        run: pip install -r requirements.txt gunicorn

      - name: インポートテスト
        run: |
          python -c "
          import config, database, auth, notifier, backup_utils, mail_utils
          import cert_utils, qr_utils, excel_export
          print('All imports OK')
          "

      - name: DB 初期化テスト
        run: |
          python -c "
          import database, auth, notifier, backup_utils
          database.init_db()
          auth.init_auth_db()
          notifier.init_notification_db()
          backup_utils.init_backup_db()
          print('DB init OK')
          "

      - name: Auth テスト
        run: |
          python -c "
          import auth
          uid, err = auth.create_user('testuser','テストユーザー','password99','viewer')
          assert uid and err is None, f'create failed: {err}'
          u = auth.verify_password('testuser', 'password99')
          assert u and u.username == 'testuser'
          ok, _ = auth.delete_user(uid)
          assert ok
          print('Auth test OK')
          "

      - name: バックアップテスト
        run: |
          python -c "
          import backup_utils as bu
          bu.init_backup_db()
          r = bu.create_backup('manual', 'ci_test')
          assert r['success'], r.get('error')
          v = bu.verify_backup(r['filename'])
          assert v['valid']
          import os; os.remove(r['path'])
          print('Backup test OK')
          "

      - name: Flask app ロードテスト
        run: |
          python -c "
          import os; os.environ['HTTPS_ENABLED']='false'
          os.environ['HTTP_REDIRECT']='false'
          os.environ['SESSION_COOKIE_SECURE']='false'
          import app
          client = app.app.test_client()
          r = client.get('/offline')
          assert r.status_code == 200, f'offline page: {r.status_code}'
          r = client.get('/login')
          assert r.status_code == 200, f'login page: {r.status_code}'
          print('Flask route test OK')
          "

  # ============================================================
  #  Docker ビルド（PR と main push で検証）
  # ============================================================
  docker-build:
    name: Docker ビルド検証
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx セットアップ
        uses: docker/setup-buildx-action@v3

      - name: Docker イメージビルド（検証のみ）
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ============================================================
  #  本番デプロイ（main ブランチまたはタグのみ）
  # ============================================================
  deploy:
    name: 本番デプロイ
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: イメージタグ決定
        id: tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: SSH デプロイ
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROD_APP_DIR }}

            # コードを更新
            git pull origin main

            # デプロイ実行
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
              bash deploy/scripts/deploy.sh

      - name: デプロイ完了通知
        if: success()
        run: echo "✅ デプロイ完了: ${{ steps.tag.outputs.tag }}"

      - name: デプロイ失敗通知
        if: failure()
        run: echo "❌ デプロイ失敗: ログを確認してください"
